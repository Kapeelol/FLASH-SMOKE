document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n        <button onclick=\"{{ useCurrent }}\" style=\"position:absolute;right:14px;bottom:16px;width:48px;height:48px;border-radius:14px;background:#1a1626;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.5);z-index:15\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a78bfa\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n\n        <div style=\"position:absolute;left:14px;bottom:16px;background:rgba(13,11,21,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:8px 12px;font-size:11.5px;color:#c4b5fd;font-weight:500;z-index:15\">ลากแผนที่เพื่อเลื่อนหมุด<\u002Fdiv>\n\n        <!-- pin -->\n        <div style=\"{{ pinStyle }}\">\n          <svg width=\"42\" height=\"52\" viewBox=\"0 0 24 30\" fill=\"none\"><path d=\"M12 0C6 0 1.5 4.5 1.5 10.5C1.5 18 12 30 12 30S22.5 18 22.5 10.5C22.5 4.5 18 0 12 0Z\" fill=\"#8b5cf6\" stroke=\"#fff\" stroke-width=\"1.4\"><\u002Fpath><circle cx=\"12\" cy=\"10.5\" r=\"4\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"{{ pulseStyle }}\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- bottom sheet -->\n      <div style=\"background:#161221;border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.08);padding:14px 20px 18px;box-shadow:0 -12px 30px rgba(0,0,0,.4);z-index:20\">\n        <div style=\"width:40px;height:4px;border-radius:2px;background:#39304d;margin:0 auto 14px\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:11px\">\n          <div style=\"width:36px;height:36px;border-radius:11px;background:rgba(139,92,246,.18);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a78bfa\" stroke-width=\"2\"><path d=\"M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.4\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <div style=\"flex:1;line-height:1.4\"><div style=\"font-size:12px;color:#9a90b0\">ตำแหน่งที่เลือก<\u002Fdiv><div style=\"font-size:14px;font-weight:500;color:#f2eefb\">{{ currentAddr }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:14px\">\n          <button onclick=\"{{ setLabelHome }}\" style=\"flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:500;background:{{ labelHomeBg }};color:{{ labelHomeFg }};border:1px solid {{ labelHomeBd }}\">🏠 บ้าน<\u002Fbutton>\n          <button onclick=\"{{ setLabelWork }}\" style=\"flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:500;background:{{ labelWorkBg }};color:{{ labelWorkFg }};border:1px solid {{ labelWorkBd }}\">💼 ที่ทำงาน<\u002Fbutton>\n          <button onclick=\"{{ setLabelOther }}\" style=\"flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:500;background:{{ labelOtherBg }};color:{{ labelOtherFg }};border:1px solid {{ labelOtherBd }}\">📍 อื่นๆ<\u002Fbutton>\n        <\u002Fdiv>\n        <input value=\"{{ addrDetail }}\" oninput=\"{{ onAddrDetail }}\" placeholder=\"รายละเอียดเพิ่มเติม เช่น ตึก B ชั้น 3, จุดสังเกต\" style=\"width:100%;height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:#0f0c18;padding:0 14px;font-size:14px;color:#f2eefb;outline:none;margin-top:10px\">\n        <button onclick=\"{{ saveAddr }}\" style=\"width:100%;height:52px;border-radius:15px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:16px;font-weight:600;box-shadow:0 12px 24px -12px rgba(124,58,237,.9);margin-top:12px\">บันทึกที่อยู่นี้<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= SAVED ================= -->\n    <sc-if value=\"{{ isSaved }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;bottom:76px;background:#0d0b15;display:flex;flex-direction:column;animation:fs-fade .3s ease\">\n      <div style=\"padding:52px 20px 18px;background:linear-gradient(135deg,#3d2b6b,#1c1630);display:flex;align-items:center;gap:14px\">\n        <button onclick=\"{{ goMethod }}\" style=\"width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <span style=\"color:#fff;font-size:19px;font-weight:600\">ที่อยู่ที่บันทึกไว้<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:20px 18px 24px\">\n        <sc-for list=\"{{ savedView }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <div style=\"background:#1a1626;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px;display:flex;align-items:flex-start;gap:13px;margin-bottom:12px\">\n            <div style=\"width:44px;height:44px;border-radius:13px;background:{{ a.iconBg }};display:flex;align-items:center;justify-content:center;flex:none;font-size:20px\">{{ a.emoji }}<\u002Fdiv>\n            <div style=\"flex:1;line-height:1.4;min-width:0\"><div style=\"font-size:15px;font-weight:600;color:#f2eefb\">{{ a.label }}<\u002Fdiv><div style=\"font-size:12.5px;color:#9a90b0;margin-top:2px\">{{ a.text }}<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:11px\">\n                <button onclick=\"{{ a.onSelect }}\" style=\"padding:7px 15px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:12.5px;font-weight:600\">จัดส่งที่นี่<\u002Fbutton>\n                <button onclick=\"{{ a.onDelete }}\" style=\"padding:7px 13px;border-radius:10px;background:rgba(255,255,255,.06);color:#9a90b0;font-size:12.5px;font-weight:500\">ลบ<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button onclick=\"{{ goMethod }}\" style=\"width:100%;height:52px;border-radius:15px;border:1.5px dashed rgba(139,92,246,.5);background:rgba(139,92,246,.08);color:#c4b5fd;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c4b5fd\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>เพิ่มที่อยู่ใหม่<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= BOTTOM NAV ================= -->\n    <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:0;right:0;bottom:0;height:76px;background:#141020;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:flex-start;padding:12px 10px 0;z-index:40\">\n      <button onclick=\"{{ goHome }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navHomeColor }}\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-8 9 8\"><\u002Fpath><path d=\"M5 10v10h14V10\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;color:{{ navHomeColor }};font-weight:500\">หน้าแรก<\u002Fspan><\u002Fbutton>\n      <button onclick=\"{{ goMethod }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navOrderColor }}\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 7h12l1 13H5z\"><\u002Fpath><path d=\"M9 7a3 3 0 0 1 6 0\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;color:{{ navOrderColor }};font-weight:500\">สั่งเลย<\u002Fspan><\u002Fbutton>\n      <button style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6a6280\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;color:#6a6280;font-weight:500\">อื่นๆ<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- toast -->\n    <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:#231d38;border:1px solid rgba(139,92,246,.4);color:#f2eefb;font-size:13.5px;font-weight:500;padding:12px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:80;white-space:nowrap;animation:fs-toast 2.4s ease forwards\">{{ toast }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:456,&quot;height&quot;:876}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = {\n      screen:'welcome', lang:'TH',\n      fullname:'', phone:'', password:'',\n      otp:['','','',''],\n      pinX:50, pinY:46, dragging:false,\n      addrDetail:'', addrLabel:'บ้าน',\n      mapStyle:'violet',\n      saved:[{label:'ที่ทำงาน', text:'มณีโสตร์ช็อป ถ.ท่าตะเภา ต.ท่าตะเภา อ.เมืองชุมพร จ.ชุมพร 86000', kind:'work'}],\n      toast:''\n    };\n    this.otpRefs=[React.createRef(),React.createRef(),React.createRef(),React.createRef()];\n    this.mapRef=React.createRef();\n    this._toastT=null;\n  }\n  go(s){ this.setState({screen:s}); }\n  showToast(msg){\n    this.setState({toast:msg});\n    clearTimeout(this._toastT);\n    this._toastT=setTimeout(()=>this.setState({toast:''}),2300);\n  }\n  addr(x,y){\n    const streets=['กรมหลวงชุมพร','ท่าตะเภา','ปรมินทรมรรคา','พิศิษฐ์พยาบาล','ศาลาแดง','นวมินทร์รวมใจ','ประชาอุทิศ','ทวีสินค้า'];\n    const tambon=['ท่าตะเภา','นาทุ่ง','บางหมาก','ตากแดด','วังไผ่','บ้านนา'];\n    const si=Math.min(streets.length-1,Math.max(0,Math.floor(y/100*streets.length)));\n    const ti=Math.min(tambon.length-1,Math.max(0,Math.floor(x/100*tambon.length)));\n    const no=Math.round(x*1.8)+'/'+Math.max(1,Math.round(y/9));\n    const soi=Math.max(1,Math.round(x/100*22));\n    return no+' ถ.'+streets[si]+' ซ.'+soi+' ต.'+tambon[ti]+' อ.เมืองชุมพร จ.ชุมพร 86000';\n  }\n  moveTo(e){\n    const el=this.mapRef.current; if(!el) return;\n    const r=el.getBoundingClientRect();\n    const x=Math.min(96,Math.max(4,((e.clientX-r.left)/r.width)*100));\n    const y=Math.min(90,Math.max(8,((e.clientY-r.top)/r.height)*100));\n    this.setState({pinX:x,pinY:y});\n  }\n  labelStyle(active){\n    return active\n      ? {bg:'rgba(139,92,246,.22)', fg:'#c4b5fd', bd:'rgba(139,92,246,.55)'}\n      : {bg:'#0f0c18', fg:'#9a90b0', bd:'rgba(255,255,255,.08)'};\n  }\n  savedMeta(kind){\n    if(kind==='home') return {emoji:'🏠', iconBg:'rgba(139,92,246,.2)'};\n    if(kind==='work') return {emoji:'💼', iconBg:'rgba(192,38,211,.2)'};\n    return {emoji:'📍', iconBg:'rgba(79,70,229,.22)'};\n  }\n  kindFromLabel(l){ return l==='บ้าน'?'home':(l==='ที่ทำงาน'?'work':'other'); }\n\n  renderVals(){\n    const st=this.state;\n    const setF=k=>e=>this.setState({[k]:e.target.value});\n    const onOtp=i=>e=>{\n      const v=(e.target.value||'').replace(/\\D/g,'').slice(-1);\n      const arr=[...this.state.otp]; arr[i]=v; this.setState({otp:arr});\n      if(v && i<3 && this.otpRefs[i+1].current) this.otpRefs[i+1].current.focus();\n    };\n    const canReg = st.fullname.trim() && st.phone.replace(/\\D/g,'').length>=9 && st.password.length>=6;\n    const otpDone = st.otp.join('').length===4;\n    const btn='linear-gradient(135deg,#a78bfa,#7c3aed)';\n    const btnOff='#2a2440';\n    const mask = st.phone ? ('+66 '+st.phone.replace(/\\D/g,'').replace(/^0/,'').slice(0,2)+'X-XXX-'+(st.phone.replace(/\\D/g,'').slice(-3)||'XXX')) : '+66 8X-XXX-XXXX';\n\n    const filters={violet:'none', mono:'grayscale(1) brightness(1.15)', night:'brightness(.72) saturate(1.5) hue-rotate(-15deg)'};\n    const vizStyle='position:absolute;inset:0;filter:'+filters[st.mapStyle]+';transition:filter .3s ease';\n    const bd=s=> st.mapStyle===s?'#fff':'rgba(255,255,255,.35)';\n\n    const pinStyle={position:'absolute',left:st.pinX+'%',top:st.pinY+'%',transform:'translate(-50%,-100%)',transition:st.dragging?'none':'left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1)',zIndex:20,pointerEvents:'none',filter:'drop-shadow(0 6px 6px rgba(0,0,0,.5))'};\n    const pulseStyle={position:'absolute',left:st.pinX+'%',top:st.pinY+'%',width:'26px',height:'26px',borderRadius:'50%',background:'rgba(139,92,246,.5)',transform:'translate(-50%,-50%)',pointerEvents:'none',zIndex:19,animation:'fs-pulse 2s ease-out infinite'};\n\n    const lh=this.labelStyle(st.addrLabel==='บ้าน');\n    const lw=this.labelStyle(st.addrLabel==='ที่ทำงาน');\n    const lo=this.labelStyle(st.addrLabel==='อื่นๆ');\n\n    const savedView=st.saved.map((a,i)=>{\n      const m=this.savedMeta(a.kind);\n      return {label:a.label, text:a.text, emoji:m.emoji, iconBg:m.iconBg,\n        onSelect:()=>{ this.showToast('เลือก '+a.label+' เป็นที่จัดส่ง ✓'); },\n        onDelete:()=>{ const s2=this.state.saved.filter((_,j)=>j!==i); this.setState({saved:s2}); this.showToast('ลบที่อยู่แล้ว'); }\n      };\n    });\n\n    return {\n      isWelcome:st.screen==='welcome', isRegister:st.screen==='register', isOtp:st.screen==='otp',\n      isHome:st.screen==='home', isMethod:st.screen==='method', isMap:st.screen==='map', isSaved:st.screen==='saved',\n      showNav:['home','method','map','saved'].includes(st.screen),\n      navHomeColor: st.screen==='home'?'#a78bfa':'#6a6280',\n      navOrderColor: (st.screen==='method'||st.screen==='map'||st.screen==='saved')?'#a78bfa':'#6a6280',\n\n      goWelcome:()=>this.go('welcome'), goRegister:()=>this.go('register'),\n      goOtp:()=>{ if(canReg) this.go('otp'); else this.showToast('กรุณากรอกข้อมูลให้ครบถ้วน'); },\n      goHome:()=>this.go('home'), goMethod:()=>this.go('method'),\n      goMap:()=>this.go('map'), goSaved:()=>this.go('saved'),\n      social:()=>{ this.showToast('เชื่อมต่อบัญชี... (ตัวอย่าง)'); setTimeout(()=>this.go('home'),700); },\n      toggleLang:()=>this.showToast('เปลี่ยนภาษา (ตัวอย่าง)'),\n\n      fullname:st.fullname, phone:st.phone, password:st.password,\n      onFullname:setF('fullname'), onPhone:setF('phone'), onPassword:setF('password'),\n      registerBtnBg: canReg?btn:btnOff,\n      phoneMasked:mask,\n      otp0:st.otp[0], otp1:st.otp[1], otp2:st.otp[2], otp3:st.otp[3],\n      onOtp0:onOtp(0), onOtp1:onOtp(1), onOtp2:onOtp(2), onOtp3:onOtp(3),\n      otpRef0:this.otpRefs[0], otpRef1:this.otpRefs[1], otpRef2:this.otpRefs[2], otpRef3:this.otpRefs[3],\n      otpBtnBg: otpDone?btn:btnOff,\n      verifyOtp:()=>{ if(otpDone){ this.showToast('ยืนยันสำเร็จ 🎉'); setTimeout(()=>this.go('home'),600); } else this.showToast('กรอกรหัสให้ครบ 4 หลัก'); },\n\n      greetName: st.fullname.trim() || 'สฤษฏ์พล มณีโสตร์',\n      savedCountLabel: st.saved.length+' ที่อยู่',\n\n      mapRef:this.mapRef,\n      onMapDown:e=>{ this.setState({dragging:true}); this.moveTo(e); },\n      onMapMove:e=>{ if(this.state.dragging) this.moveTo(e); },\n      onMapUp:()=>this.setState({dragging:false}),\n      mapVizStyle:vizStyle,\n      pinStyle, pulseStyle,\n      setStyleViolet:()=>this.setState({mapStyle:'violet'}),\n      setStyleMono:()=>this.setState({mapStyle:'mono'}),\n      setStyleNight:()=>this.setState({mapStyle:'night'}),\n      styleVioletBd:bd('violet'), styleMonoBd:bd('mono'), styleNightBd:bd('night'),\n      useCurrent:()=>{ this.setState({pinX:50,pinY:46}); this.showToast('ปักหมุดที่ตำแหน่งของคุณแล้ว'); },\n      useCurrentThenMap:()=>{ this.setState({pinX:50,pinY:46,screen:'map'}); this.showToast('กำลังค้นหาตำแหน่ง GPS...'); },\n\n      currentAddr:this.addr(st.pinX,st.pinY),\n      addrDetail:st.addrDetail, onAddrDetail:setF('addrDetail'),\n      setLabelHome:()=>this.setState({addrLabel:'บ้าน'}),\n      setLabelWork:()=>this.setState({addrLabel:'ที่ทำงาน'}),\n      setLabelOther:()=>this.setState({addrLabel:'อื่นๆ'}),\n      labelHomeBg:lh.bg, labelHomeFg:lh.fg, labelHomeBd:lh.bd,\n      labelWorkBg:lw.bg, labelWorkFg:lw.fg, labelWorkBd:lw.bd,\n      labelOtherBg:lo.bg, labelOtherFg:lo.fg, labelOtherBd:lo.bd,\n      saveAddr:()=>{\n        const txt=this.addr(st.pinX,st.pinY)+(st.addrDetail.trim()?(' ('+st.addrDetail.trim()+')'):'');\n        const item={label:st.addrLabel, text:txt, kind:this.kindFromLabel(st.addrLabel)};\n        this.setState({saved:[item,...this.state.saved], addrDetail:'', screen:'saved'});\n        this.showToast('บันทึกที่อยู่แล้ว ✓');\n      },\n      savedView,\n      toast:st.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
